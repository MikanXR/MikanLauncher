# Builds the release launcher and assembles the package tree around it from the release
# zips components.json pins. A manual run is a dry run of the same steps. The tree is kept
# as a workflow artifact. Upload to Steam is not part of this workflow.
name: Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release --locked -p mikan-launcher
      # The component repositories are public, so the workflow's own token reads their releases.
      - run: python tools/package.py --launcher target/release/MikanLauncher.exe --out package
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MikanXR-Package
          path: package
          retention-days: 14
