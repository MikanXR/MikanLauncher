# Builds the release launcher with the official branding and assembles the package tree around it from the release
# zips components.json pins. A manual run is a dry run of the same steps. The tree is kept
# as a workflow artifact. Upload to Steam is not part of this workflow.
name: Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    runs-on: windows-latest
    env:
      # A step's condition cannot read a secret, so the branding checkout tests this.
      HAS_BRANDING_KEY: ${{ secrets.MIKAN_BRANDING_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The MikanXR icon and logo are not part of this repository. The build takes them
      # from this checkout when it is present. A run without the key, a fork's for one,
      # builds with the generic set.
      - name: Checkout branding
        if: env.HAS_BRANDING_KEY == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MikanXR/MikanBranding
          ref: v1
          ssh-key: ${{ secrets.MIKAN_BRANDING_DEPLOY_KEY }}
          path: branding/official
          persist-credentials: false
      - name: Require branding for a tagged release
        if: github.repository_owner == 'MikanXR' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [ ! -f branding/official/mikanlauncher/icon.ico ]; then
            echo "::error::A tagged MikanXR release needs the branding checkout, and it is missing. Check the MIKAN_BRANDING_DEPLOY_KEY secret."
            exit 1
          fi
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release --locked -p mikan-launcher
      # The public component repositories' releases read under the workflow's own token.
      # MikanStudio's repository is private, so its download takes a token of its own, a
      # fine-grained one limited to that repository with read-only Contents.
      - run: python tools/package.py --launcher target/release/MikanLauncher.exe --out package
        env:
          GH_TOKEN: ${{ github.token }}
          MIKANSTUDIO_RELEASE_TOKEN: ${{ secrets.MIKANSTUDIO_RELEASE_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MikanXR-Package
          path: package
          retention-days: 14
