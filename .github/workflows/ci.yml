# The gates on each platform the launcher is meant to build for: build, test, clippy, and
# fmt, with a clippy warning failing the run. Each platform's own runner checks its
# branches of the per-platform code. The dependency audit reads no platform, so it runs once.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an older run's result moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The window toolkit's font lookup and the file dialog link the system's libraries.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libgtk-3-dev
      # Reads rust-toolchain.toml: the pinned compiler and its components.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --workspace --locked
      # Each gate after the build runs whatever an earlier one reported, so a single run
      # reports every failure.
      - run: cargo test --workspace --no-fail-fast
        if: ${{ !cancelled() }}
      - run: cargo clippy --workspace --all-targets -- -D warnings
        if: ${{ !cancelled() }}
      - run: cargo fmt --all --check
        if: ${{ !cancelled() }}

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install cargo-deny --locked
      - run: cargo deny check
