[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
repository = "https://github.com/MikanXR/MikanLauncher"
publish = false

[workspace.dependencies]
mikan-launcher-core = { path = "crates/mikan-launcher-core" }

directories = "6"
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# The window alone: the winit backend and the software renderer, so the launcher holds no
# GPU context beside the compositor and the renderer it starts.
slint = { version = "1.19", default-features = false, features = ["compat-1-2", "std", "backend-winit", "renderer-software"] }
slint-build = "1.19"
steamlocate = "2.1"
# The process list alone: no disks, networks, or sensors.
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tempfile = "3"
thiserror = "2"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# The shipped binary is small: one codegen unit under fat LTO, symbols stripped, and no
# unwinding machinery since a panic ends the process either way.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
