[package]
name = "mikan-launcher-core"
description = "The launcher's logic: the app catalog, install lookup, process control, and plugin installs."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
directories.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
steamlocate.workspace = true
sysinfo.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
# The library loader, to hold a file the way a host that loaded it does.
windows = { workspace = true, features = ["Win32_System_LibraryLoader"] }

